<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>FlicMap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --white:#fff; --ink:#f2f2f2; --muted:#9a9a9a;
    --glass:rgba(0,0,0,.42); --line:rgba(255,255,255,.2); --panel:#0d0d0d; --chip:#1b1b1b;
    --signal:#ffd60a;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:"Archivo",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  button:focus-visible,input:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

  /* Camera */
  #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  .topbar{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(var(--safe-t) + 14px) 18px 14px;
    display:flex;align-items:center;justify-content:space-between;background:linear-gradient(rgba(0,0,0,.45),transparent)}
  .wordmark{font-weight:900;font-stretch:125%;font-size:22px;letter-spacing:-.02em;color:var(--white)}
  .gps{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;padding:7px 11px;border-radius:99px;
    background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .gps i{width:8px;height:8px;border-radius:50%;background:#777;display:block}
  .gps.ok i{background:var(--signal);box-shadow:0 0 0 3px rgba(255,214,10,.25)}
  .gps.weak i{background:#ff9f0a}
  .bottombar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:8px 30px calc(var(--safe-b) + 22px);
    display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"hint hint hint" "l shutter r";row-gap:18px;align-items:center;
    background:linear-gradient(transparent,rgba(0,0,0,.6))}
  .pull{grid-area:hint;justify-self:center;display:flex;flex-direction:column;align-items:center;gap:4px;
    font-size:13px;font-weight:600;color:var(--white);text-shadow:0 1px 6px rgba(0,0,0,.6);padding:6px 14px}
  .pull svg{width:22px;height:22px;animation:nudge 2.4s ease-in-out infinite}
  .pull b{color:var(--signal)}
  @keyframes nudge{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-5px)}}
  .shutter{grid-area:shutter;width:82px;height:82px;border-radius:50%;border:4px solid var(--white);display:grid;place-items:center}
  .shutter span{width:64px;height:64px;border-radius:50%;background:var(--white);transition:transform .1s}
  .shutter:active span{transform:scale(.88)}
  .round{width:52px;height:52px;border-radius:50%;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    display:grid;place-items:center;border:1px solid var(--line)}
  .round svg{width:24px;height:24px}
  #flipBtn{grid-area:r;justify-self:end}
  .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9;transition:opacity .25s}
  .flash.on{opacity:.8;transition:none}
  .notice{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:40px;text-align:center;z-index:4;font-size:16px;line-height:1.5;color:#bbb}
  .notice.show{display:flex}
  .notice button{margin-top:18px;padding:12px 20px;border-radius:99px;background:var(--white);color:#000;font-weight:700}

  /* Review and edit */
  .review{position:fixed;inset:0;z-index:40;background:#000;display:none;flex-direction:column}
  .review.show{display:flex}
  .review > img{height:38vh;width:100%;object-fit:cover;flex:none}
  .review-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 8px}
  .review-actions{flex:none;padding:12px 18px calc(var(--safe-b) + 14px);background:#000;border-top:1px solid #1a1a1a}
  .meta{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
  .meta strong{color:var(--white);font-weight:600}
  .note{width:100%;margin:14px 0 6px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#111;color:var(--white);font:inherit;font-size:16px}
  .note::placeholder{color:#6f6f6f}
  .group{margin-top:18px}
  .group h4{margin:0 0 9px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
  .group h4 small{font-size:12px;font-weight:500;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:99px;background:var(--chip);
    border:1px solid transparent;font-size:14px;font-weight:500;color:#ddd;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--white);color:#000;font-weight:700}
  .chip .sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.35);flex:none}
  .chip[aria-pressed="true"] .sw{border-color:rgba(0,0,0,.3)}
  .row{display:flex;gap:10px}
  .btn{flex:1;padding:16px;border-radius:14px;font-weight:700;font-size:16px;text-align:center}
  .btn.ghost{border:1px solid var(--line)}
  .btn.solid{background:var(--white);color:#000}
  .btn.solid:disabled{opacity:.45}
  .btn.danger{color:#ff453a;border:1px solid rgba(255,69,58,.35)}

  /* Drawer (swipe up) */
  .drawer{position:fixed;inset:0;z-index:30;background:var(--panel);transform:translateY(100%);
    transition:transform .34s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;will-change:transform}
  .drawer.open{transform:none}
  .dhead{flex:none;padding:calc(var(--safe-t) + 8px) 16px 10px;background:var(--panel);touch-action:none}
  .grab{width:44px;height:5px;border-radius:3px;background:#444;margin:0 auto 12px}
  .dbar{display:flex;align-items:center;gap:10px}
  .seg{display:flex;background:#1b1b1b;border-radius:12px;padding:3px;flex:1;max-width:260px}
  .seg button{flex:1;padding:9px 0;border-radius:9px;font-weight:700;font-size:14px;color:#aaa}
  .seg button[aria-pressed="true"]{background:var(--white);color:#000}
  .count{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500}
  .closeX{width:38px;height:38px;border-radius:50%;background:#1b1b1b;display:grid;place-items:center}
  .closeX svg{width:18px;height:18px}
  .filters{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters .chip{padding:7px 11px;font-size:13px}
  .filters:empty{display:none}
  .dbody{flex:1;position:relative;min-height:0}
  #map{position:absolute;inset:0}
  .album{position:absolute;inset:0;overflow-y:auto;padding:2px 2px calc(var(--safe-b) + 20px);display:none;
    grid-template-columns:repeat(3,1fr);gap:2px;align-content:start}
  .album.show{display:grid}
  .album button{aspect-ratio:1;position:relative;overflow:hidden;background:#222}
  .album img{width:100%;height:100%;object-fit:cover;display:block}
  .album span{position:absolute;left:6px;bottom:6px;right:6px;font-size:11px;font-weight:700;color:#fff;text-align:left;
    text-shadow:0 1px 4px rgba(0,0,0,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{position:absolute;left:16px;right:16px;top:24px;z-index:2;padding:18px;border-radius:16px;background:rgba(0,0,0,.85);
    font-size:15px;line-height:1.45;display:none}

  .pin{width:0;height:0;cursor:pointer}
  .pin .cone{position:absolute;left:50%;top:50%;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;
    border-bottom:44px solid rgba(255,214,10,.45);transform-origin:50% 100%;margin-left:-16px;margin-top:-44px}
  .pin .face{position:absolute;left:0;top:0;width:52px;height:52px;padding:0;border-radius:14px;border:2px solid var(--white);overflow:hidden;background:#333;
    box-shadow:0 6px 16px rgba(0,0,0,.55);transform:translate(-50%,-50%) rotate(var(--rot,0deg));
    transition:width .25s ease,height .25s ease,border-radius .25s ease,transform .25s ease,opacity .2s}
  .pin[data-size="main"] .face{width:68px;height:68px;border-radius:18px}
  .pin[data-size="sub"] .face,.pin[data-size="tuck"] .face{width:44px;height:44px;border-radius:12px}
  .pin:not([data-size="single"]) .cone{display:none}
  .pin .badge{position:absolute;left:0;top:0;transform:translate(20px,-48px);padding:3px 8px;border-radius:99px;background:var(--white);color:#000;
    font-size:12px;font-weight:800;box-shadow:0 3px 8px rgba(0,0,0,.5);white-space:nowrap;pointer-events:none}
  .pin .badge:empty{display:none}
  .pin .face img{width:100%;height:100%;object-fit:cover;display:block}

  /* Spot sheet */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:35;background:#111;border-radius:22px 22px 0 0;max-height:88vh;overflow-y:auto;
    padding:10px 16px calc(var(--safe-b) + 16px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 -10px 40px rgba(0,0,0,.6)}
  .sheet.show{transform:none}
  .sheet img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;display:block}
  .sheet h3{margin:14px 2px 4px;font-size:20px;font-weight:700}
  .sheet .meta{margin:0 2px 12px}
  .sheet .chips{margin:0 0 14px}
  .sheet .chips .chip{padding:6px 10px;font-size:13px}
  .sheet .row + .row{margin-top:10px}
  .scrim{position:fixed;inset:0;z-index:34;background:rgba(0,0,0,.4);display:none}
  .scrim.show{display:block}

  .toast{position:fixed;left:50%;top:calc(var(--safe-t) + 70px);transform:translate(-50%,-20px);opacity:0;z-index:60;
    padding:11px 18px;border-radius:99px;background:var(--white);color:#000;font-weight:700;font-size:14px;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  #cam.mirror{transform:scaleX(-1)}
  .avatar{width:38px;height:38px;border-radius:50%;background:#1b1b1b;overflow:hidden;display:grid;place-items:center;flex:none;font-weight:800;font-size:15px;color:#ddd}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 2px 4px}
  .titlerow h3{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  [hidden]{display:none!important}
  .titlebtn{display:flex;align-items:center;gap:8px;flex:1;min-width:0;text-align:left;padding:6px 0}
  .titlebtn svg{width:17px;height:17px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .titlebtn.untitled h3{color:var(--muted)}
  .titleinput{flex:1;min-width:0;font:inherit;font-size:20px;font-weight:700;color:var(--white);background:#1b1b1b;border:1px solid var(--line);border-radius:10px;padding:7px 10px;outline:none}
  .titleinput:focus{border-color:var(--signal)}
  .fav{width:44px;height:44px;border-radius:50%;background:#1b1b1b;display:grid;place-items:center;flex:none}
  .fav svg{width:22px;height:22px;fill:none;stroke:#ddd;stroke-width:2;transition:transform .15s}
  .fav[aria-pressed="true"] svg{fill:var(--signal);stroke:var(--signal)}
  .fav:active svg{transform:scale(.8)}
  .album .heart{position:absolute;top:6px;right:6px;width:18px;height:18px;fill:var(--signal);filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
  .chip .hs{width:14px;height:14px;fill:var(--signal)}
  .chip[aria-pressed="true"] .hs{fill:#000}
  .pin.fav .face{border-color:var(--signal)}
  .sheet.zoomed img{animation:zoomin .35s cubic-bezier(.2,.8,.2,1)}
  @keyframes zoomin{from{transform:scale(.55);opacity:0;border-radius:50%}to{transform:none;opacity:1}}
  .profile{position:fixed;inset:0;z-index:45;background:#000;display:none;flex-direction:column}
  .profile.show{display:flex}
  .phead{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-t) + 14px) 18px 10px}
  .phead h2{margin:0;font-size:20px;font-weight:800}
  .pbody{flex:1;overflow-y:auto;padding:10px 18px 20px}
  .pphoto{display:block;margin:10px auto 6px;width:112px;height:112px;border-radius:50%;background:#1b1b1b;overflow:hidden;position:relative;cursor:pointer}
  .pphoto img{width:100%;height:100%;object-fit:cover;display:block}
  .pphoto span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:600;color:#bbb}
  .pphoto img + span{display:none}
  .plabel{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:18px 2px 0}
  .pbody .note{margin-top:7px}
  .phint{font-size:12px;color:var(--muted);margin:6px 2px 0;line-height:1.4}
  .phint.err{color:#ff453a}
  .pfoot{flex:none;padding:12px 18px calc(var(--safe-b) + 14px);border-top:1px solid #1a1a1a}
  .seg{max-width:340px}
  .seg button{font-size:13px}
  @media (max-width:430px){ .count{display:none} }
  .feed{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding-bottom:calc(var(--safe-b) + 24px)}
  .feed.show{display:block}
  .fsort{position:sticky;top:0;z-index:2;display:flex;gap:8px;padding:10px 12px;background:var(--panel)}
  .fsort .chip{padding:7px 12px;font-size:13px}
  .card{margin:0 0 20px;cursor:pointer}
  .chead{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-size:14px}
  .cuser{font-weight:700}
  .ctime{color:var(--muted);font-size:13px}
  .card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#1a1a1a}
  .cbody{padding:10px 14px 0}
  .cbody h4{margin:0 0 4px;font-size:17px;font-weight:700}
  .cmeta{font-size:13px;color:var(--muted);margin-bottom:8px}
  .card .chips .chip{padding:5px 9px;font-size:12px}
  .fmore{display:block;margin:4px auto 20px;padding:12px 20px;border-radius:99px;background:#1b1b1b;font-weight:700;font-size:14px}
  #map .mapboxgl-canvas{filter:grayscale(1) contrast(1.08)}
  .drawer.adjusting #map .mapboxgl-canvas{filter:none}
  .pin.mine .face{border-color:var(--signal)}
  .pin .face.blank{background:#2a2a2a}
  .titlebtn.ro{pointer-events:none}
  .titlebtn.ro svg{display:none}
  .status{font-size:13px;color:var(--signal);font-weight:600;margin:0 2px 12px}
  .sheet #sheetActions .row{margin-top:10px}
  .sheet #sheetActions .row:first-child{margin-top:0}

  /* Pin fixing */
  #adjustUI{position:absolute;inset:0;z-index:3;pointer-events:none;display:none}
  .drawer.adjusting #adjustUI{display:block}
  .drawer.adjusting .dhead{pointer-events:none;opacity:.35}
  .drawer.adjusting .mapboxgl-ctrl-bottom-right{display:none}
  .xhair{position:absolute;left:50%;top:50%;width:44px;height:58px;margin:-58px 0 0 -22px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
  .xhair svg{width:100%;height:100%;display:block}
  .shotdot{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #000;box-shadow:0 0 0 2px #fff}
  .satbtn{position:absolute;top:12px;right:12px;pointer-events:auto;padding:9px 14px;border-radius:99px;background:rgba(10,10,10,.85);font-weight:700;font-size:13px}
  .abar{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-b) + 12px);pointer-events:auto;background:rgba(10,10,10,.92);
    border-radius:18px;padding:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .abar p{margin:0 0 3px;font-weight:700;font-size:15px}
  .abar small{display:block;color:var(--muted);font-size:13px;margin-bottom:12px}

  /* Dialogs */
  .dlg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
  .dlg.show{display:flex}
  .dbox{width:100%;background:#111;border-radius:22px 22px 0 0;padding:20px 18px calc(var(--safe-b) + 16px);max-height:90vh;overflow-y:auto}
  .dbox h3{margin:0 0 8px;font-size:20px}
  .dbox p{margin:0 0 14px;color:#bbb;font-size:15px;line-height:1.45}
  .dbox p strong{color:var(--white)}
  .check{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:#1b1b1b;margin:0 0 16px;font-size:15px;line-height:1.4}
  .check input{width:22px;height:22px;flex:none;accent-color:var(--signal);margin:0}
  .warn{padding:14px;border-radius:14px;border:1px solid rgba(255,214,10,.45);margin:0 0 14px;font-size:14px;line-height:1.45}
  .warn button{display:block;margin-top:10px;font-weight:700;color:var(--signal)}
  .opts{display:flex;flex-direction:column;gap:8px;margin:0 0 16px}
  .opts button{padding:14px;border-radius:14px;background:#1b1b1b;text-align:left;font-size:15px}
  .opts button[aria-pressed="true"]{background:var(--white);color:#000;font-weight:700}
  .acct{margin-top:24px;padding-top:6px;border-top:1px solid #1a1a1a}
  .acct .btn{width:100%;margin-top:10px}
  .note:disabled{opacity:.6}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>
<canvas id="canvas" hidden></canvas>
<div class="flash" id="flash"></div>

<div class="notice" id="camNotice"><div>
  <div id="camNoticeText">FlicMap needs your camera and location to save spots.</div>
  <button id="camRetry">Turn on camera</button>
</div></div>

<header class="topbar">
  <div class="wordmark">flicmap</div>
  <div class="gps" id="gps"><i></i><span id="gpsText">Finding you</span></div>
</header>

<footer class="bottombar">
  <button class="pull" id="pullBtn" aria-label="Open your spots">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>
    <span id="pullText">Swipe up for your spots</span>
  </button>
  <button class="shutter" id="shutter" aria-label="Snap spot"><span></span></button>
  <button class="round" id="flipBtn" aria-label="Flip camera">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
  </button>
</footer>

<section class="drawer" id="drawer" aria-label="Your spots">
  <div class="dhead" id="dhead">
    <div class="grab"></div>
    <div class="dbar">
      <button class="avatar" id="avatarBtn" aria-label="Your profile"></button>
      <div class="seg" role="group" aria-label="View">
        <button id="segMap" aria-pressed="true">Map</button>
        <button id="segAlbum" aria-pressed="false">Album</button>
        <button id="segExplore" aria-pressed="false">Explore</button>
        <button id="segFeed" aria-pressed="false">Feed</button>
      </div>
      <div class="count" id="countLabel">0 spots</div>
      <button class="closeX" id="closeDrawer" aria-label="Back to camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>
    <div class="filters" id="filters"></div>
  </div>
  <div class="dbody">
    <div id="map"></div>
    <div id="adjustUI">
      <div class="xhair"><svg viewBox="0 0 44 58" aria-hidden="true"><path d="M22 56S4 34 4 21a18 18 0 0 1 36 0c0 13-18 35-18 35z" fill="#ffd60a" stroke="#000" stroke-width="2.5"/><circle cx="22" cy="21" r="6.5" fill="#000"/></svg></div>
      <button class="satbtn" id="adjSat">Street map</button>
      <div class="abar">
        <p>Drag the map until the pin sits on the spot</p>
        <small id="adjDist"></small>
        <div class="row"><button class="btn ghost" id="adjCancel">Cancel</button><button class="btn solid" id="adjSave">Save pin</button></div>
      </div>
    </div>
    <div class="album" id="album"></div>
    <div class="feed" id="feed"><div class="fsort" id="fsort"></div><div id="feedList"></div></div>
    <div class="empty" id="empty"></div>
  </div>
</section>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <img id="sheetImg" alt="">
  <div class="titlerow">

<div class="toast" id="toast"></div>

<script>
(() => {
  // Public Mapbox token (pk), locked to gxmichu.github.io in Mapbox. Split so GitHub's scanner doesn't block it.
  const MAPBOX_TOKEN = ['pk', 'eyJ1IjoidHJhdnhwcnoiLCJhIjoiY211bzNqdGN0MDFjYzJ4cHp1a280a2VqdCJ9', 'emltSInnaZZMiexFIEsxIA'].join('.');

  // Supabase publishable key is meant to be public; the database rules decide what anyone can do.
  const SB_URL = 'https://pkldtyjilkeomypaozkh.supabase.co';
  const SB_KEY = ['sb_publishable', 'kUGjQP8CtWYEszFHcnMdBg_o6StDzHz'].join('_');
  const sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false } }) : null;
  const DARK = 'mapbox://styles/mapbox/dark-v11', SAT = 'mapbox://styles/mapbox/satellite-streets-v12';

  /* Tag system. multi = pick several, otherwise pick one */
  const TAGS = [
    { key:'color', label:'Colors', multi:true, options:[
      ['red','Red','#e5383b'],['orange','Orange','#f77f00'],['yellow','Yellow','#ffd60a'],['green','Green','#2d9d4f'],
      ['blue','Blue','#2f6fed'],['purple','Purple','#8e44ad'],['pink','Pink','#ff70a6'],['brown','Brown','#8b5a2b'],
      ['black','Black','#000'],['white','White','#fff'],['gray','Gray','#8a8a8a'],['multi','Multicolor','conic-gradient(#e5383b,#ffd60a,#2d9d4f,#2f6fed,#8e44ad,#e5383b)']
    ]},
    { key:'surface', label:'Wall and area', multi:true, options:[
      ['brick','Brick'],['concrete','Concrete'],['mural','Mural'],['graffiti','Graffiti'],['wood','Wood'],['metal','Metal'],
      ['stone','Stone'],['glass','Glass'],['greenery','Greenery'],['water','Water'],['alley','Alley'],['stairs','Stairs'],
      ['rooftop','Rooftop'],['street','Street'],['field','Open field'],['industrial','Industrial'],['storefront','Storefront']
    ]},
    { key:'footwear', label:'Footwear', options:[
      ['anyshoes','Any shoes work'],['sneakers','Sneakers ok'],['boots','Boots better'],['muddy','Gets muddy'],
      ['wet','Wet ground'],['rough','Rough or rocky'],['nowhites','Skip white shoes']
    ]},
    { key:'movement', label:'Foot traffic', options:[
      ['still','Dead quiet'],['some','Some people'],['busy','Busy'],['cars','Cars passing']
    ]},
    { key:'visibility', label:'How public', options:[
      ['hidden','Hidden'],['semi','Semi public'],['public','Very public']
    ]}
  ];
  const OPT = {};
  TAGS.forEach(g => g.options.forEach(([id, name, sw]) => OPT[g.key + ':' + id] = { group:g.key, name, sw }));
  const emptyTags = () => ({ color:[], surface:[], footwear:null, movement:null, visibility:null });
  const flatTags = t => {
    if(!t) return [];
    const out = [];
    TAGS.forEach(g => { const v = t[g.key]; (g.multi ? (v || []) : (v ? [v] : [])).forEach(id => out.push(g.key + ':' + id)); });
    return out;
  };
  const HEART = '<svg class="hs" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.4 4.5 7 4.5c2 0 3.6 1.1 5 2.9 1.4-1.8 3-2.9 5-2.9 3.6 0 5.6 3.5 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>';
  const chipHTML = (k, pressed, tag) => {
    if(k === 'fav') return `<button class="chip" data-k="fav" aria-pressed="${pressed}">${HEART}Favorites</button>`;
    const o = OPT[k]; if(!o) return '';
    const sw = o.sw ? `<i class="sw" style="background:${o.sw}"></i>` : '';
    return `<${tag||'button'} class="chip" data-k="${k}" ${pressed != null ? `aria-pressed="${pressed}"` : ''}>${sw}${o.name}</${tag||'button'}>`;
  };

  const $ = id => document.getElementById(id);
  const video = $('cam'), canvas = $('canvas'), drawer = $('drawer');
  let facing = 'environment', stream = null, lastFix = null, heading = null, orientationAsked = false;
  let spots = [], urls = new Map();
  let editing = null; // { mode:'new'|'edit', spot, tags }
  let view = 'map', filters = new Set(), openSpot = null;
  let session = null, cloudProfile = null, codeSent = false;
  let feed = [], feedSort = 'near', feedLoading = false, feedDone = false, feedErr = '', feedSeq = 0;
  let pub = [], pubLoading = false, pubError = '', pubTimer = null, pubSeq = 0;
  const signed = new Map(), names = new Map();
  let hiddenPub = new Set();
  try{ hiddenPub = new Set(JSON.parse(localStorage.getItem('fm_hidden') || '[]')); }catch(e){}
  const saveHidden = () => { try{ localStorage.setItem('fm_hidden', JSON.stringify([...hiddenPub])); }catch(e){} };

  /* Storage */
  const dbReady = new Promise((res, rej) => {
    const r = indexedDB.open('flicmap', 2);
    r.onupgradeneeded = () => {
      const db = r.result;
      if(!db.objectStoreNames.contains('spots')) db.createObjectStore('spots', { keyPath:'id' });
      if(!db.objectStoreNames.contains('profile')) db.createObjectStore('profile', { keyPath:'id' });
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  async function tx(mode, fn, store = 'spots'){
    const db = await dbReady;
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode), out = fn(t.objectStore(store));
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      t.onerror = () => rej(t.error);
    });
  }
  const getAll = () => tx('readonly', s => s.getAll());
  const putSpot = s => tx('readwrite', st => st.put(s));
  const delSpot = id => tx('readwrite', st => st.delete(id));
  const getProfile = () => tx('readonly', st => st.get('me'), 'profile');
  const putProfile = p => tx('readwrite', st => st.put(p), 'profile');
  const urlFor = s => { if(!urls.has(s.id)) urls.set(s.id, URL.createObjectURL(s.blob)); return urls.get(s.id); };

  /* Camera */
  async function startCamera(){
    stopCamera();
    try{
      stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:facing }, width:{ ideal:1920 }, height:{ ideal:1080 } }, audio:false });
      video.srcObject = stream; $('camNotice').classList.remove('show');
      video.classList.toggle('mirror', facing === 'user');
    }catch(e){
      $('camNoticeText').textContent = 'Camera is blocked. Allow camera access for this site in your browser settings, then tap below.';
      $('camNotice').classList.add('show');
    }
  }
  function stopCamera(){ if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } }
  $('camRetry').onclick = startCamera;
  $('flipBtn').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCamera(); };

  /* Location */
  function startGPS(){
    if(!navigator.geolocation) return setGPS('none','No location');
    navigator.geolocation.watchPosition(p => {
      lastFix = { lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy, t:Date.now() };
      p.coords.accuracy <= 30 ? setGPS('ok', `Located within ${Math.round(p.coords.accuracy)}m`) : setGPS('weak', `Rough location, ${Math.round(p.coords.accuracy)}m`);
    }, () => setGPS('none','Location off'), { enableHighAccuracy:true, maximumAge:2000, timeout:20000 });
  }
  function setGPS(s, t){ $('gps').className = 'gps ' + s; $('gpsText').textContent = t; }

  /* Compass */
  function onOrient(e){
    if(typeof e.webkitCompassHeading === 'number') heading = e.webkitCompassHeading;
    else if(e.absolute && typeof e.alpha === 'number') heading = (360 - e.alpha) % 360;
  }
  async function askOrientation(){
    if(orientationAsked) return; orientationAsked = true;
    try{
      if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
        if(await DeviceOrientationEvent.requestPermission() !== 'granted') return;
      }
      addEventListener('deviceorientationabsolute', onOrient, true);
      addEventListener('deviceorientation', onOrient, true);
    }catch(e){}
  }
  const compass = d => ['N','NE','E','SE','S','SW','W','NW'][Math.round(d / 45) % 8];

  /* Tag panel */
  function renderTagPanel(){
    const t = editing.tags;
    $('tagPanel').innerHTML = TAGS.map(g => {
      const chosen = g.multi ? t[g.key] : (t[g.key] ? [t[g.key]] : []);
      return `<div class="group"><h4>${g.label}<small>${g.multi ? 'pick any' : 'pick one'}</small></h4><div class="chips">` +
        g.options.map(([id]) => chipHTML(g.key + ':' + id, chosen.includes(id))).join('') + `</div></div>`;
    }).join('');
  }
  $('tagPanel').addEventListener('click', e => {
    const c = e.target.closest('.chip'); if(!c) return;
    const [g, id] = c.dataset.k.split(':'), grp = TAGS.find(x => x.key === g), t = editing.tags;
    if(grp.multi){ const a = t[g]; const i = a.indexOf(id); i < 0 ? a.push(id) : a.splice(i, 1); }
    else t[g] = t[g] === id ? null : id;
    renderTagPanel();
  });

  /* Capture */
  $('shutter').onclick = async () => {
    askOrientation();
    if(!stream || !video.videoWidth) return toast('Camera is not ready yet');
    const w = video.videoWidth, h = video.videoHeight, k = Math.min(1, 1600 / Math.max(w, h));
    canvas.width = Math.round(w * k); canvas.height = Math.round(h * k);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if(facing === 'user'){ ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    $('flash').classList.add('on'); setTimeout(() => $('flash').classList.remove('on'), 60);
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.82));
    const fix = lastFix && Date.now() - lastFix.t < 60000 ? lastFix : null;
    editing = { mode:'new', blob, fix, heading, ts:Date.now(), tags:emptyTags(), url:URL.createObjectURL(blob) };
    $('reviewImg').src = editing.url;
    $('noteInput').value = '';
    $('reviewMeta').innerHTML = fix
      ? `<span><strong>${fix.lat.toFixed(5)}, ${fix.lng.toFixed(5)}</strong></span><span>within ${Math.round(fix.acc)}m</span>${heading != null ? `<span>facing ${compass(heading)}</span>` : ''}`
      : '<span><strong>No location yet.</strong> Wait for the dot to turn yellow, then retake.</span>';
    $('cancelBtn').textContent = 'Retake'; $('saveBtn').textContent = 'Save spot';
    $('saveBtn').disabled = !fix;
    renderTagPanel();
    $('review').querySelector('.review-scroll').scrollTop = 0;
    $('review').classList.add('show');
  };

  function openEditor(s){
    editing = { mode:'edit', spot:s, tags:Object.assign(emptyTags(), JSON.parse(JSON.stringify(s.tags || {}))) };
    $('reviewImg').src = urlFor(s);
    $('noteInput').value = s.note || '';
    $('reviewMeta').innerHTML = `<span>Editing spot from ${new Date(s.ts).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span>`;
    $('cancelBtn').textContent = 'Cancel'; $('saveBtn').textContent = 'Save changes'; $('saveBtn').disabled = false;
    renderTagPanel();
    $('review').querySelector('.review-scroll').scrollTop = 0;
    $('review').classList.add('show');
  }
  function closeReview(){
    if(editing && editing.mode === 'new') URL.revokeObjectURL(editing.url);
    $('review').classList.remove('show'); editing = null;
  }
  $('cancelBtn').onclick = closeReview;
  $('saveBtn').onclick = async () => {
    if(!editing) return;
    $('saveBtn').disabled = true;
    try{
      if(editing.mode === 'new'){
        if(!editing.fix) return;
        const s = { id:String(editing.ts), ts:editing.ts, lat:editing.fix.lat, lng:editing.fix.lng, acc:editing.fix.acc,
          heading:editing.heading, note:$('noteInput').value.trim(), tags:editing.tags, blob:editing.blob };
        await putSpot(s); spots.unshift(s); closeReview(); updateCounts(); toast('Spot saved');
      }else{
        const s = editing.spot; s.note = $('noteInput').value.trim(); s.tags = editing.tags;
        await putSpot(s); syncCloud(s); closeReview(); refresh(); showSheet(s); toast('Changes saved');
      }
    }catch(e){ toast('Could not save. Try again.'); $('saveBtn').disabled = false; }
  };

  /* Drawer: swipe up from the camera to open, drag the header down to close */
  let drawerOpen = false;
  function setDrawerY(px){ drawer.style.transition = 'none'; drawer.style.transform = `translateY(${Math.max(0, px)}px)`; }
  function openDrawer(){
    drawer.style.transition = ''; drawer.style.transform = ''; drawer.classList.add('open');
    if(drawerOpen) return; drawerOpen = true; stopCamera(); refresh();
    if(view === 'map') setTimeout(ensureMap, 60);
  }
  function closeDrawer(){
    drawer.style.transition = ''; drawer.style.transform = ''; drawer.classList.remove('open');
    endAdjust(); hideSheet(); if(!drawerOpen) return; drawerOpen = false; startCamera();
  }
  function dragger(zoneTest, fromOpen){
    let y0 = null, t0 = 0, dy = 0;
    document.addEventListener('touchstart', e => {
      if(!zoneTest(e)) return;
      y0 = e.touches[0].clientY; t0 = Date.now(); dy = 0;
    }, { passive:true });
    document.addEventListener('touchmove', e => {
      if(y0 == null) return;
      dy = e.touches[0].clientY - y0;
      if(fromOpen && dy > 0) setDrawerY(dy);
      if(!fromOpen && dy < 0) setDrawerY(innerHeight + dy);
    }, { passive:true });
    document.addEventListener('touchend', () => {
      if(y0 == null) return;
      const v = dy / Math.max(1, Date.now() - t0); y0 = null;
      if(fromOpen) (dy > 120 || v > .5) ? closeDrawer() : openDrawer();
      else (dy < -80 || v < -.5) ? openDrawer() : closeDrawer();
    });
  }
  const cameraIdle = () => !drawerOpen && !$('review').classList.contains('show');
  dragger(e => cameraIdle() && !e.target.closest('#shutter,#flipBtn,.notice button'), false);
  dragger(e => drawerOpen && !!e.target.closest('#dhead') && !e.target.closest('button'), true);
  addEventListener('wheel', e => { if(cameraIdle() && e.deltaY > 25) openDrawer(); }, { passive:true });
  $('pullBtn').onclick = openDrawer;
  $('closeDrawer').onclick = closeDrawer;

  /* Map and album */
  $('segMap').onclick = () => setView('map');
  $('segAlbum').onclick = () => setView('album');
  $('segExplore').onclick = () => setView('explore');
  $('segFeed').onclick = () => setView('feed');
  function setView(v){
    endAdjust();
    const was = view; view = v;
    ['Map','Album','Explore','Feed'].forEach(n => $('seg' + n).setAttribute('aria-pressed', v === n.toLowerCase()));
    $('album').classList.toggle('show', v === 'album');
    $('feed').classList.toggle('show', v === 'feed');
    $('map').style.visibility = v === 'album' || v === 'feed' ? 'hidden' : 'visible';
    if(v === 'map' || v === 'explore') ensureMap();
    refresh();
    if(v === 'explore') loadPublic();
    if(v === 'feed' && !feed.length && !feedLoading){ if(!lastFix) feedSort = 'new'; loadFeed(true); }
    else if(v === 'map' && was === 'explore') fitPins();
  }
  const base = () => view === 'explore' ? pub.filter(p => !hiddenPub.has(p.id)) : view === 'feed' ? feed.filter(p => !hiddenPub.has(p.id)) : spots;
  const passes = s => { const f = flatTags(s.tags); for(const k of filters) if(k === 'fav' ? !s.fav : !f.includes(k)) return false; return true; };
  const visible = () => base().filter(passes);
  const imgFor = s => s.pub ? (signed.get(s.thumb_path) || '') : urlFor(s);
  function updateCounts(){
    $('pullText').innerHTML = spots.length ? `Swipe up for your <b>${spots.length}</b> spot${spots.length === 1 ? '' : 's'}` : 'Swipe up for your spots';
  }
  function refresh(){
    const b = base();
    const used = new Set(); b.forEach(s => { flatTags(s.tags).forEach(k => used.add(k)); if(s.fav) used.add('fav'); });
    [...filters].forEach(k => { if(!used.has(k)) filters.delete(k); });
    const order = (used.has('fav') ? ['fav'] : []).concat(Object.keys(OPT).filter(k => used.has(k)));
    $('filters').innerHTML = order.map(k => chipHTML(k, filters.has(k))).join('');
    const vis = b.filter(passes);
    if(view === 'feed'){ $('countLabel').textContent = `${vis.length} posts`; renderFeed(vis); renderEmpty(); updateCounts(); return; }
    if(view === 'explore') $('countLabel').textContent = pubLoading && !pub.length ? 'Loading' : `${vis.length} public`;
    else $('countLabel').textContent = filters.size ? `${vis.length} of ${b.length}` : `${b.length} spot${b.length === 1 ? '' : 's'}`;
    if(view !== 'explore') $('album').innerHTML = vis.map(s => `<button data-id="${s.id}"><img src="${urlFor(s)}" alt="" loading="lazy">${s.fav ? `<svg class="heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.4 4.5 7 4.5c2 0 3.6 1.1 5 2.9 1.4-1.8 3-2.9 5-2.9 3.6 0 5.6 3.5 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>` : ''}${s.note ? `<span>${esc(s.note)}</span>` : ''}</button>`).join('');
    drawPins(vis); renderEmpty(); updateCounts();
  }
  function renderEmpty(){
    const e = $('empty');
    if(view === 'feed'){
      const msg = feedErr || (feedLoading || visible().length ? '' : feed.length ? 'No posts match those tags. Tap a highlighted tag above to remove it.' : 'Nothing posted yet. Open one of your spots and tap Share to public map to post the first one.');
      e.textContent = msg; e.style.display = msg ? 'block' : 'none'; if(msg) e.style.top = '64px'; return;
    }
    e.style.top = '';
    if(view === 'explore'){
      const msg = pubError || (pubLoading ? '' : !visible().length ? (pub.length ? 'No public spots match those tags. Tap a highlighted tag above to remove it.' : 'No public spots in this area yet. Share one of yours from its spot page and it shows up here for everyone.') : '');
      e.textContent = msg; e.style.display = msg ? 'block' : 'none'; return;
    }
    if(!spots.length){ e.textContent = 'No spots yet. Swipe down, point your camera at somewhere worth coming back to, and tap the shutter.'; e.style.display = 'block'; }
    else if(!visible().length){ e.textContent = 'No spots match those tags. Tap a highlighted tag above to remove it.'; e.style.display = 'block'; }
    else e.style.display = 'none';
  }
  $('filters').addEventListener('click', e => {
    const c = e.target.closest('.chip'); if(!c) return;
    filters.has(c.dataset.k) ? filters.delete(c.dataset.k) : filters.add(c.dataset.k);
    refresh(); fitPins();
  });
  $('album').addEventListener('click', e => {
    const b = e.target.closest('button[data-id]'); if(!b) return;
    showSheet(spots.find(s => s.id === b.dataset.id));
  });

  let map = null, markers = [], mapReady = false;
  function ensureMap(){
    if(map){ map.resize(); return; }
    mapboxgl.accessToken = MAPBOX_TOKEN;
    const c = spots[0] || lastFix;
    map = new mapboxgl.Map({ container:'map', style:DARK,
      center: c ? [c.lng, c.lat] : [-81.0998, 32.0809], zoom: c ? 14 : 11 });
    map.addControl(new mapboxgl.GeolocateControl({ positionOptions:{ enableHighAccuracy:true }, trackUserLocation:true, showUserHeading:true }), 'bottom-right');
    map.on('load', () => { mapReady = true; drawPins(visible()); if(view === 'explore') loadPublic(); else fitPins(); });
    map.on('zoomend', autoOpen);
    map.on('moveend', () => { if(view === 'explore' && !adjusting){ clearTimeout(pubTimer); pubTimer = setTimeout(loadPublic, 350); } });
    map.on('move', () => { layoutPins(); if(adjusting) adjustInfo(); });
    map.on('resize', layoutPins);
    map.on('error', e => {
      const st = e && e.error && e.error.status;
      if(st === 401 || st === 403){
        const el = $('empty');
        el.textContent = "Map couldn't load. The map key was rejected, so your spots are safe but the map can't show them. Use Album for now.";
        el.style.display = 'block';
      }
    });
  }
  /* Zoom all the way into a spot and it opens */
  const OPEN_ZOOM = 18, REARM_ZOOM = 17;
  let lastAuto = null;
  function autoOpen(){
    if(view === 'album' || !drawerOpen || adjusting) return;
    const z = map.getZoom();
    if(z < REARM_ZOOM){ lastAuto = null; return; }
    if(z < OPEN_ZOOM || openSpot) return;
    const c = map.project(map.getCenter());
    let best = null, bd = Infinity;
    visible().forEach(s => { const p = map.project([s.lng, s.lat]); const d = Math.hypot(p.x - c.x, p.y - c.y); if(d < bd){ bd = d; best = s; } });

  function drawPins(list){
    if(!map) return;

    const { error } = await sb.from('spots').delete().eq('id', id);
    if(error){ toast("Couldn't reach the public map. Try again with signal."); return false; }
    if(paths && paths.length) sb.storage.from('spot-photos').remove(paths).catch(() => {});
    return true;
  }
  async function unshare(s){
    if(!confirm("Take this spot off the public map? Your copy on this phone isn't touched.")) return;
    const id = s.pub ? s.id : s.cloudId, paths = s.pub ? [s.photo_path, s.thumb_path] : s.cloudPaths;
    if(!(await removeCloud(id, paths))) return;
    const local = s.pub ? spots.find(x => x.cloudId === id) : s;
    if(local){ delete local.cloudId; delete local.cloudPaths; await putSpot(local); }
    pub = pub.filter(p => p.id !== id); feed = feed.filter(p => p.id !== id);
    hideSheet(); refresh(); toast('Removed from the public map');
  }
  async function syncCloud(s){
    if(!s || !s.cloudId || !sb || !session) return;
    const { error } = await sb.from('spots').update({ note:s.note || null, tags:s.tags || {}, lat:s.lat, lng:s.lng, heading:s.heading ?? null }).eq('id', s.cloudId);
    if(error) toast("Saved here, but the public copy didn't update");
  }
  async function copyToMine(s){
    if(spots.some(x => x.from && x.from.id === s.id)) return toast('Already in your spots');
    try{
      const u = await fullUrl(s.photo_path); if(!u) throw 0;
      const blob = await (await fetch(u)).blob(), ts = Date.now();
      const n = { id:String(ts), ts, lat:s.lat, lng:s.lng, acc:0, heading:s.heading, note:s.note, tags:Object.assign(emptyTags(), JSON.parse(JSON.stringify(s.tags || {}))),
        blob, moved:true, from:{ id:s.id, username:s.username } };
      await putSpot(n); spots.unshift(n); updateCounts(); toast('Saved to your spots');
    }catch(e){ toast("Couldn't save it. Try again."); }
  }
  const REASONS = [['private', "Someone's home or private property"], ['unsafe', 'Unsafe or trespassing'], ['inappropriate', 'Inappropriate photo'], ['spam', 'Spam or wrong location']];
  function openReport(s){
    if(needAccount('Sign in below to report spots')) return;
    let pick = null;
    openDlg(`<h3>Report this spot</h3><p>What's wrong with it?</p>
      <div class="opts">${REASONS.map(([k, t]) => `<button data-a="pick" data-r="${k}" aria-pressed="false">${t}</button>`).join('')}</div>
      <div class="row"><button class="btn ghost" data-a="close">Cancel</button><button class="btn solid" data-a="send" id="doReport" disabled>Report</button></div>`, {
      close: closeDlg,
      pick: b => { pick = b.dataset.r; $('dlgBox').querySelectorAll('[data-r]').forEach(x => x.setAttribute('aria-pressed', x === b)); $('doReport').disabled = false; },
      send: async b => {
        b.disabled = true;
        const { error } = await sb.from('spot_reports').insert({ spot_id:s.id, reason:pick });
        if(error && error.code !== '23505'){ b.disabled = false; return toast("Couldn't send the report. Try again."); }
        hiddenPub.add(s.id); saveHidden(); closeDlg(); hideSheet(); refresh();
        toast(error ? 'You already reported this one' : 'Reported. Thanks for flagging it.');
      }
    });
  }

  /* Profile (on this phone for now, maps to an online account later) */
  let profile = { id:'me', username:'', location:'', email:'', photo:null }, newPhoto;
  const avatarURL = () => profile.photo ? (profile._url || (profile._url = URL.createObjectURL(profile.photo))) : null;
  function renderAvatar(){
    const u = avatarURL();
    $('avatarBtn').innerHTML = u ? `<img src="${u}" alt="">` : (profile.username ? esc(profile.username[0].toUpperCase()) : '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>');
  }
  function setPhotoPreview(url){
    const box = $('pphoto'), img = box.querySelector('img');
    if(img) img.remove();
    if(url){ const i = document.createElement('img'); i.src = url; i.alt = ''; box.prepend(i); }
  }
  $('avatarBtn').onclick = () => openProfile();
  function openProfile(msg){
    newPhoto = undefined;
    $('pUser').value = profile.username; $('pLoc').value = profile.location; $('pEmail').value = profile.email;
    $('userHint').classList.remove('err'); $('userHint').textContent = 'Letters, numbers, periods and underscores. 3 to 20 characters.';
    setPhotoPreview(avatarURL());
    codeSent = false; renderAcct();
    $('profile').classList.add('show');
    if(msg) toast(msg);
  }
  $('closeProfile').onclick = () => $('profile').classList.remove('show');
  $('pUser').addEventListener('input', e => { e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9._]/g, ''); });
  $('photoInput').addEventListener('change', async e => {
    const f = e.target.files[0]; if(!f) return;
    try{
      const bmp = await createImageBitmap(f), side = Math.min(bmp.width, bmp.height), c = document.createElement('canvas');
      c.width = c.height = 400;
      c.getContext('2d').drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, 400, 400);
      newPhoto = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
      setPhotoPreview(URL.createObjectURL(newPhoto));
    }catch(err){ toast('Could not use that photo'); }
    e.target.value = '';
  });
  $('saveProfile').onclick = async () => {
    const u = $('pUser').value.trim(), em = $('pEmail').value.trim();
    if(u && !/^[a-z0-9._]{3,20}$/.test(u)){ $('userHint').textContent = 'Username needs 3 to 20 letters, numbers, periods or underscores.'; $('userHint').classList.add('err'); return; }
    if(em && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return toast('That email looks off');
    if(session){
      const { error } = await sb.from('profiles').upsert({ id:session.user.id, username:u || null, city:$('pLoc').value.trim() || null });
      if(error){
        if(error.code === '23505'){ $('userHint').textContent = 'That username is taken. Try another.'; $('userHint').classList.add('err'); return; }
        return toast("Couldn't save to your account. Try again.");
      }
      cloudProfile = { username:u, city:$('pLoc').value.trim() };
    }
    profile.username = u; profile.location = $('pLoc').value.trim(); profile.email = em;
    if(newPhoto !== undefined){ if(profile._url) URL.revokeObjectURL(profile._url); profile._url = null; profile.photo = newPhoto; }
    const { _url, ...store } = profile;
    try{ await putProfile(store); renderAvatar(); $('profile').classList.remove('show'); toast('Profile saved'); }
    catch(err){ toast('Could not save profile'); }
  };

  function renderAcct(){
    const a = $('acct');
    $('pEmail').disabled = !!session;
    if(session) $('pEmail').value = session.user.email || '';
    if(!sb){ a.innerHTML = '<div class="phint">Accounts are offline right now.</div>'; return; }
    if(session){
      a.innerHTML = `<label class="plabel">Account</label><div class="phint">Signed in as <strong>${esc(session.user.email || '')}</strong>. Your username and city show on spots you share. Your email stays private.</div>` + btn('signOut', 'ghost', 'Sign out');
    }else{
      a.innerHTML = `<label class="plabel">Account</label><div class="phint">Sign in with the email above to share spots on the public map and report bad ones. Anything you don't share stays on this phone.</div>` +
        (codeSent ? `<input class="note" id="codeInput" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="Code from your email">` + btn('verifyCode', 'solid', 'Sign in') + btn('sendCode', 'ghost', 'Send a new code')
          : btn('sendCode', 'solid', 'Email me a sign in code'));
    }
  }
  $('acct').addEventListener('click', async e => {
    const b = e.target.closest('button'); if(!b || !sb) return;
    if(b.id === 'sendCode'){
      const em = $('pEmail').value.trim();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return toast('Type your email above first');
      b.disabled = true;
      const { error } = await sb.auth.signInWithOtp({ email:em });
      b.disabled = false;
      if(error) return toast(/rate|seconds|security/i.test(error.message || '') ? 'Too many codes. Wait a minute, then try again.' : "Couldn't send the code. Try again.");
      codeSent = true; renderAcct(); toast('Code sent. Check your email.');
    }else if(b.id === 'verifyCode'){
      const code = ($('codeInput').value || '').replace(/\D/g, ''), em = $('pEmail').value.trim();
      if(code.length < 6) return toast('Type the code from the email');
      b.disabled = true;
      const { error } = await sb.auth.verifyOtp({ email:em, token:code, type:'email' });
      b.disabled = false;
      if(error) return toast("That code didn't work. Check it or send a new one.");
      codeSent = false; toast('Signed in');
    }else if(b.id === 'signOut'){
      await sb.auth.signOut(); cloudProfile = null; toast('Signed out');
    }
  });
  async function loadCloudProfile(){
    if(!session) return;
    const { data, error } = await sb.from('profiles').select('username,city').eq('id', session.user.id).maybeSingle();
    if(error) return;
    cloudProfile = data || null;
    if(data && data.username){
      if(data.username !== profile.username || (data.city && data.city !== profile.location)){
        profile.username = data.username; if(data.city) profile.location = data.city;
        const { _url, ...st } = profile; putProfile(st).catch(() => {}); renderAvatar();
        if($('profile').classList.contains('show')){ $('pUser').value = profile.username; $('pLoc').value = profile.location; }
      }
    }else if(profile.username){
      const r = await sb.from('profiles').upsert({ id:session.user.id, username:profile.username, city:profile.location || null });
      if(!r.error) cloudProfile = { username:profile.username, city:profile.location };
    }
  }
  function onSession(sess){
    session = sess || null;
    if($('profile').classList.contains('show')) renderAcct();
    if(session) setTimeout(loadCloudProfile, 0); else cloudProfile = null;
    if(view === 'explore') setTimeout(loadPublic, 0);
  }
  if(sb){
    sb.auth.onAuthStateChange((ev, sess) => onSession(sess));
    sb.auth.getSession().then(r => onSession(r.data.session)).catch(() => {});
  }

  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), Math.max(1600, m.length * 55)); }

  document.addEventListener('visibilitychange', () => {
    if(document.hidden) stopCamera(); else if(cameraIdle()) startCamera();
  });

  (async () => {
    startCamera(); startGPS();
    try{ spots = (await getAll()).sort((a, b) => b.ts - a.ts); }catch(e){}
    try{ const p = await getProfile(); if(p) profile = Object.assign(profile, p); }catch(e){}
    renderAvatar();
    updateCounts();
  })();
})();
</script>
</body>
</html>
